    <script id="report-data" type="application/json">{"mode":"trip","publicMode":true,"generatedAt":"2026-11-26T09:46:18.337Z","trip":{"title":"Berlin City-Break Cheat Sheet — 27–29 Nov 2026","subtitle":"Two vegan, teetotal adults · fun side of Berlin · options, not a fixed schedule · staying in Prenzlauer Berg","currency":"EUR","days":[{"key":"fri","date":"2026-11-27","label":"Friday 27 Nov","short":"Fri"},{"key":"sat","date":"2026-11-28","label":"Saturday 28 Nov","short":"Sat"},{"key":"sun","date":"2026-11-29","label":"Sunday 29 Nov (First Advent)","short":"Sun"}],"practical":[{"title":"Cold & dark","text":"Forecast is dry but freezing (about -4°C to 0°C all weekend). Sunset is about 16:00 each day, so daylight sightseeing needs to be indoors or done before 15:30. Hat, gloves and a proper coat."},{"title":"Getting around","text":"Buy tickets in the BVG app or at station machines before boarding. Airport trips need an ABC ticket (€5 single, valid 2 h); inside Berlin AB (€4 single, €11.20 for 24 h). Contactless is not a ticket on trains, so validate paper tickets. The U-Bahn runs all night on Fri and Sat nights."},{"title":"Trains to the airport","text":"S9/S85 to BER are closed from Fri 27 Nov 21:30 to Mon 30 Nov 01:30. For the return use the FEX / RE20 from Potsdamer Platz or Hauptbahnhof (U2 from Eberswalder Straße to Potsdamer Platz), or a taxi. Leave the flat about 3 hours before a flight. Check the BVG/VBB app for diversions on the day."},{"title":"Sunday","text":"Sunday is quiet in Germany: ordinary shops are shut, but museums, cafés, restaurants, markets and concerts run. Many restaurants close Sunday or Monday: check the Sun hours on each card."},{"title":"Booking","text":"Book ahead for the tasting-menu restaurants, TV Tower, Museum für Naturkunde time slots, Computerspielemuseum, Spy Museum, Christmas Garden and the big concerts. Everything marked 'Book ahead' has an official link on its card."},{"title":"Spas","text":"Vabali is a textile-free (nude) saun
